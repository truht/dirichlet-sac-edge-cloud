# ============================================================
# EdgeCloudSim - SAC/DRL Offloading Simulation Configuration
# Track: tutorial3_ai_flop (gpu_dual / DualChannelScheduler) --
# GPU/CPU workload set directly in applications.xml, no CNN-model
# formula. See /PROTOCOL.md and DRLScenarioFactory for what's reused.
# ============================================================

simulation_time=10
warm_up_period=1
file_log_enabled=true
deep_file_log_enabled=false

vm_load_check_interval=0.1
location_check_interval=0.1
ap_delay_check_interval=0

# DRLMainApp only ever uses getMinNumOfMobileDev() (no device-count sweep,
# see DRLMainApp.java) -- so only min_number_of_mobile_devices matters here.
# Was 50, inherited from the old sample_app_ai3-based config without
# reconsidering it against the applications.xml/poisson_interarrival values
# actually copied from tutorial3_ai_flop, which were calibrated assuming
# 200-2000 devices (see that app's own default_config.properties). At 50
# devices against this project's 112 VMs, hosts sat idle almost always
# (Q_i stayed at 0-1 the whole time, confirmed by direct inspection) --
# Jain's Fairness rounded to 1.000 and drop_count stayed 0 every single
# episode across 1500+ episodes of training, because there was never
# enough contention for routing decisions to matter. 300 restores genuine
# load without needing the full 2000 tutorial3_ai_flop used (which would
# also slow the simulation considerably).
#
# Tried 1500 briefly to stress-test the energy-model fix (confirmed it
# works -- Jain's Fairness genuinely moved off 1.000). But at 1500 devices
# (~292k tasks/episode) a single CloudSim episode took OVER 3 HOURS
# wall-clock and still hadn't finished -- far too slow to iterate on
# hyperparameters (e.g. the alpha-clamp retune below). Back to 300 for
# fast iteration; revisit a larger count only for a final production run
# once hyperparameters are confirmed stable.
min_number_of_mobile_devices=300
max_number_of_mobile_devices=300
mobile_device_counter_size=50

# Network parameters (WLAN/WAN delay from SampleNetworkModel empirical tables)
wan_propagation_delay=0.1
lan_internal_delay=0.005
wlan_bandwidth=0
wan_bandwidth=0
gsm_bandwidth=0

# Cloud GPU: NVIDIA T4-class -- matches tutorial3_ai_flop's own config and
# DualChannelCloudServerManager's doc example (gpu_flops=10178 / 3,500,000
# ~= 3ms). DualChannelScheduler uses this as the GPU channel divisor
# (gpuTime = tensors / mips_for_cloud_vm); CPU channel uses the hardcoded
# DualChannelCloudServerManager.CLOUD_CPU_MIPS (100,000, Intel Xeon).
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=8
core_for_cloud_vm=4
mips_for_cloud_vm=3500000
ram_for_cloud_vm=32000
storage_for_cloud_vm=1000000

# Mobile GPU: disabled (tasks go to edge Jetson or cloud)
core_for_mobile_vm=0
mips_for_mobile_vm=0
ram_for_mobile_vm=0
storage_for_mobile_vm=0

# DRLScenarioFactory hardcodes the "SAC" policy directly (no orchestrator
# policy loop like the other apps) -- this line is unused, kept only so
# SimSettings has a non-empty value.
orchestrator_policies=SAC

# DRLMainApp only ever uses scenarios[0]. DEFAULT_TX2 matches this
# config's edge_devices.xml (cpu_mips=3000, gpu_mips=135000, vram_mb=8192).
simulation_scenarios=DEFAULT_TX2

attractiveness_L1_mean_waiting_time=480
attractiveness_L2_mean_waiting_time=300
attractiveness_L3_mean_waiting_time=120
